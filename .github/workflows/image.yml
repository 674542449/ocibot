# 推送到 main 后把镜像构建好发到 ghcr.io，服务器安装 / 更新时直接下载，不在本机构建
# （scripts/install.sh 的 use_prebuilt_images）。1 核 1 GB 的服务器现场构建会把内存耗尽。
#
# 标签是完整的提交号：服务器只下载和它本机代码同一个提交的那份，还会核对烤进镜像里的
# OCIBOT_GIT_SHA。:main 只用来告诉服务器「这个仓库发过镜像、值得等一等」，没人按它下载。
#
# x86 和 ARM 各在原生机器上构建（公开仓库免费），比 QEMU 模拟快得多；甲骨文的免费实例两种
# 都有（AMD 是 x86，Ampere A1 是 ARM）。两边推送时只按内容摘要（不打标签），最后一步合成
# 一个多架构镜像再打标签 —— 半成品不会以提交号的名义出现。
#
# 第一次发布后这个包默认是私有的，要在 GitHub 上改成公开一次，服务器才能匿名下载（见 README
# 「发版约定」）。
#
# 第三方 Action 都钉在提交上（后面注释是对应的版本号），不跟着标签走：标签可以被改指向。
name: image

on:
  push:
    branches: [main]

permissions: {}

# 排队而不是取消：服务器总是更新到最新的提交，最新那次一定要构建完。
concurrency:
  group: image
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          build-args: OCIBOT_GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/arm64
          build-args: OCIBOT_GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        env:
          AMD64: ${{ needs.amd64.outputs.digest }}
          ARM64: ${{ needs.arm64.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$SHA" -t "$IMAGE:main" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:$SHA"
