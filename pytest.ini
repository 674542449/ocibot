[pytest]
# --dist loadfile 是**必须**的，不是偏好。
#
# 套件里有 21 个模块级 fixture（分布在 17 个文件），而且每个测试模块在 import 时
# 各自 tempfile.mkdtemp() 出一个库、再用 os.environ.setdefault("DATABASE_URL", ...)
# 认领它 —— 那是「进程内先到先得」。xdist 默认的 --dist load 会把同一个文件的测试
# 打散到不同 worker 上，于是模块级 fixture 每个 worker 重跑一遍，而那个模块的
# SQLite 状态被劈成几半。loadfile 保证一个文件只落在一个 worker 上，
# 每个 worker 独立挑自己的临时库，互相撞不到。
#
# 并行本身不在这里打开：加了 -n 之后连跑单个文件都要付一遍 worker 启动 +
# 收集的钱（import oci 就要 1.2s）。要并行显式写：
#
#     python -m pytest tests -q -n 6
#
# 实测拐点在 6：4 个 31.0s / 6 个 22.6s / 8 个 23.0s / 12 个 23.1s ——
# 再多只是让全量收集互相抢 CPU，不要用 -n auto。
addopts = --dist loadfile
testpaths = tests
