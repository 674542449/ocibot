# OCIBot — production stack (API + Worker + PostgreSQL)
#
# Quick start:
#   cp web/.env.example web/.env   # edit secrets
#   docker compose up -d --build
#   open http://<host>:8000
#
# One-click (from a blank server):
#   curl -fsSL https://raw.githubusercontent.com/<OWNER>/ocibot/master/scripts/install.sh | bash
#
# Update:
#   ./scripts/install.sh update
#   # or: docker compose pull && docker compose up -d --build

name: ocibot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocibot_dev_pass}
      POSTGRES_DB: ocibot
    volumes:
      - ocibot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocibot -d ocibot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    # Not published to host by default (more secure). Uncomment if you need psql from outside.
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        OCIBOT_GIT_SHA: ${OCIBOT_GIT_SHA:-unknown}
        FRONTEND_CACHE_BUST: ${OCIBOT_GIT_SHA:-unknown}
    env_file:
      - web/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ocibot:${POSTGRES_PASSWORD:-ocibot_dev_pass}@db:5432/ocibot
      OCIBOT_CORS_ORIGINS: ${OCIBOT_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      OCIBOT_API_WORKERS: ${OCIBOT_API_WORKERS:-2}
      OCIBOT_DB_POOL_SIZE: ${OCIBOT_DB_POOL_SIZE:-10}
      OCIBOT_DB_MAX_OVERFLOW: ${OCIBOT_DB_MAX_OVERFLOW:-20}
      OCIBOT_REQUIRE_SECURE_SECRETS: ${OCIBOT_REQUIRE_SECURE_SECRETS:-0}
      # In-panel self-update (admin). Requires mounts below.
      # OCIBOT_HOST_REPO must be the absolute path on the *host* (set by install.sh).
      OCIBOT_UPDATE_ENABLED: ${OCIBOT_UPDATE_ENABLED:-1}
      OCIBOT_UPDATE_REPO: ${OCIBOT_UPDATE_REPO:-674542449/ocibot}
      OCIBOT_UPDATE_BRANCH: ${OCIBOT_UPDATE_BRANCH:-main}
      OCIBOT_HOST_DIR: /host/ocibot
      OCIBOT_HOST_REPO: ${OCIBOT_HOST_REPO:-/root/ocibot}
      OCIBOT_GIT_SHA: ${OCIBOT_GIT_SHA:-unknown}
      OCIBOT_DOCKER_CLI_IMAGE: ${OCIBOT_DOCKER_CLI_IMAGE:-docker:27-cli}
    volumes:
      # Same absolute path on host and in helper containers (critical for self-update).
      - ${OCIBOT_HOST_REPO:-/root/ocibot}:/host/ocibot
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${OCIBOT_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["python", "-m", "web.backend.worker"]
    env_file:
      - web/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ocibot:${POSTGRES_PASSWORD:-ocibot_dev_pass}@db:5432/ocibot
      OCIBOT_WORKER_ID: ${OCIBOT_WORKER_ID:-worker-1}
      OCIBOT_DB_POOL_SIZE: ${OCIBOT_DB_POOL_SIZE:-5}
      OCIBOT_DB_MAX_OVERFLOW: ${OCIBOT_DB_MAX_OVERFLOW:-10}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ocibot_pg:
