# OCIBot — production stack (API + Worker + PostgreSQL)
#
# Quick start:
#   cp web/.env.example web/.env   # edit secrets
#   docker compose up -d --build
#   open http://<host>:8000
#
# One-click (from a blank server):
#   curl -fsSL https://raw.githubusercontent.com/<OWNER>/ocibot/master/scripts/install.sh | bash
#
# Update:
#   ./scripts/install.sh update
#   # or: docker compose pull && docker compose up -d --build

name: ocibot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocibot_dev_pass}
      POSTGRES_DB: ocibot
    volumes:
      - ocibot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocibot -d ocibot"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Not published to host by default (more secure). Uncomment if you need psql from outside.
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        OCIBOT_GIT_SHA: ${OCIBOT_GIT_SHA:-unknown}
        FRONTEND_CACHE_BUST: ${OCIBOT_GIT_SHA:-unknown}
    env_file:
      - web/.env
    environment:
      # NOTE: keys listed here OVERRIDE web/.env (compose gives `environment:`
      # precedence over `env_file:`). OCIBOT_REQUIRE_SECURE_SECRETS, CORS_ORIGINS,
      # API_WORKERS and the pool sizes used to be repeated here with `:-default`
      # fallbacks, which silently discarded whatever web/.env said — including the
      # REQUIRE_SECURE_SECRETS=1 that install.sh writes, so the production secret
      # guard never actually ran. They now come from web/.env, falling back to the
      # application defaults in web/backend/config.py.
      DATABASE_URL: postgresql+psycopg://ocibot:${POSTGRES_PASSWORD:-ocibot_dev_pass}@db:5432/ocibot
      # Pin the IN-CONTAINER listen port. OCIBOT_PORT is the host publish knob
      # below; run.py also reads it to choose the listen port, so a non-8000 value
      # in web/.env would move the listener away from the port the mapping and the
      # healthcheck target.
      OCIBOT_PORT: 8000
      # In-panel self-update (admin). Requires mounts below.
      # OCIBOT_HOST_REPO must be the absolute path on the *host* (set by install.sh).
      #
      # OFF by default: applying an update runs a helper container on the mounted
      # docker.sock (and may enter the host namespace), so an admin session that
      # can reach it is effectively host root. scripts/install.sh sets this to 1
      # explicitly, so the supported install keeps one-click update; enable it for
      # a manual compose deploy only if every admin is trusted.
      OCIBOT_UPDATE_ENABLED: ${OCIBOT_UPDATE_ENABLED:-0}
      OCIBOT_UPDATE_REPO: ${OCIBOT_UPDATE_REPO:-674542449/ocibot}
      OCIBOT_UPDATE_BRANCH: ${OCIBOT_UPDATE_BRANCH:-main}
      OCIBOT_HOST_DIR: /host/ocibot
      OCIBOT_HOST_REPO: ${OCIBOT_HOST_REPO:-/root/ocibot}
      OCIBOT_GIT_SHA: ${OCIBOT_GIT_SHA:-unknown}
      OCIBOT_DOCKER_CLI_IMAGE: ${OCIBOT_DOCKER_CLI_IMAGE:-docker:27-cli}
    volumes:
      # Same absolute path on host and in helper containers (critical for self-update).
      - ${OCIBOT_HOST_REPO:-/root/ocibot}:/host/ocibot
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Defaults to every interface. Behind a TLS reverse proxy set
      # OCIBOT_BIND=127.0.0.1 so the plain-HTTP port is not reachable directly.
      - "${OCIBOT_BIND:-0.0.0.0}:${OCIBOT_PORT:-8000}:8000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
    command: ["python", "-m", "web.backend.worker"]
    env_file:
      - web/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ocibot:${POSTGRES_PASSWORD:-ocibot_dev_pass}@db:5432/ocibot
      OCIBOT_WORKER_ID: ${OCIBOT_WORKER_ID:-worker-1}
      OCIBOT_DB_POOL_SIZE: ${OCIBOT_DB_POOL_SIZE:-5}
      OCIBOT_DB_MAX_OVERFLOW: ${OCIBOT_DB_MAX_OVERFLOW:-10}
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ocibot_pg:
