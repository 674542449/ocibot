<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OCIBot">
  <!-- 独立文件版：给 apple-touch-icon、登录页，以及任何把 logo 当图片引用的地方用。
       这些场景没有 CSS 上下文，拿不到 currentColor，所以颜色是写死的。
       侧边栏用的是 AppLayout.vue 里内联的同一套几何 —— 那份跟随 --accent。
       几何数字与 favicon.svg、scripts/make_favicon.py 一致，改一个要改全部。

       标记「环与核心」：环 = 云上的资源池，核心 = 面板管着的那台机器。 -->
  <rect width="32" height="32" rx="7" fill="#c6613f"/>
  <!-- 带底板时字形收到 78%：16 - 16*0.78 = 3.52，平移 3.52 保持居中。 -->
  <g transform="translate(3.52 3.52) scale(0.78)">
    <circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="4.2"/>
    <circle cx="16" cy="16" r="4.2" fill="#fff"/>
  </g>
</svg>
