<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OCIBot">
  <!-- OCIBot 品牌标记「环与核心」—— 全站唯一的一份。
       logo.svg 与 favicon.svg 逐字相同；侧边栏、手机顶栏、登录页都直接引用 /logo.svg；
       位图图标（favicon.ico、apple-touch-icon.png、icon-192/512.png）由
       scripts/make_favicon.py 按同一套几何生成。tests/test_brand_mark.py 钉着这几处。
       环 = 云上的资源池，核心 = 面板管着的那台机器。 -->
  <rect width="32" height="32" rx="7" fill="#c6613f"/>
  <!-- 字形收到 78%：16 - 16*0.78 = 3.52，平移 3.52 保持居中。 -->
  <g transform="translate(3.52 3.52) scale(0.78)">
    <circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="4.2"/>
    <circle cx="16" cy="16" r="4.2" fill="#fff"/>
  </g>
</svg>
