<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OCIBot">
  <!-- 标记「环与核心」：环 = 云上的资源池，核心 = 面板管着的那台机器。
       完全对称、只有两个形状，16px 的标签页里也分得清。

       浏览器标签页里需要一个实心的轮廓才好找，所以 favicon 带底板；
       侧边栏那个是透明字形（见 AppLayout.vue），两者是有意分开的。 -->
  <style>
    /* Claude 陶土橙。白字形 4.05:1。 */
    .tile { fill: #c6613f }
    /* 这不是应用的暗色模式（应用已经只有一套配色）：标签栏是浏览器自己画的，
       系统用深色时底板换成更亮的一档，免得在深色标签栏上发闷。白字形仍有 3.12:1。 */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #d97757 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <!-- 带底板时字形收到 78%：圆环外径 26.2，不收就贴着底板边缘，在标签栏里又挤又糊。
       16 - 16*0.78 = 3.52，所以平移 3.52 保持居中。
       侧边栏那个裸字形**不收** —— 没有底板，本来就该填满自己的盒子。 -->
  <g transform="translate(3.52 3.52) scale(0.78)">
    <circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="4.2"/>
    <circle cx="16" cy="16" r="4.2" fill="#fff"/>
  </g>
</svg>
